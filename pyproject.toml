[project]
name = "yapzip"
version = "0.0.1"
description = "Streaming compressor for human text headed into an LLM (prototype)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
 "mlx-lm>=0.32.2",
 "tiktoken>=0.7",
]

[project.scripts]
yapzip = "yapzip.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
